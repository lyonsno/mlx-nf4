[build-system]
requires = ["setuptools>=77", "wheel", "cmake>=3.27", "nanobind==2.15.0", "mlx>=0.32.2"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-nf4"
version = "0.1.0"
description = "NF4 quantization and native Metal matrix multiplication for MLX"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Noah Lyons"}]
keywords = ["mlx", "metal", "nf4", "quantization", "apple-silicon"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mlx>=0.32.2"]

[project.optional-dependencies]
gpt2 = ["huggingface-hub", "mlx-lm", "numpy", "safetensors", "tokenizers"]

[project.urls]
Homepage = "https://github.com/lyonsno/mlx-nf4"
Repository = "https://github.com/lyonsno/mlx-nf4"
Issues = "https://github.com/lyonsno/mlx-nf4/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mlx_nf4 = ["*.so", "*.dylib", "*.metallib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
