[build-system]
requires = ["setuptools>=68", "wheel", "cmake>=3.25", "nanobind==2.12.0", "mlx>=0.31.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-nf4"
version = "0.0.0"
description = "NF4 / NormalFloat4 quantization helpers and Metal kernels for MLX"
requires-python = ">=3.10"
dependencies = ["mlx>=0.31.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mlx_nf4 = ["*.so", "*.dylib", "*.metallib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
